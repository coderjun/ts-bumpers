name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome ci .
      - run: pnpm typecheck
      - run: pnpm test
      # Diagrams render, cover every package, and changed diagrams have a changelog entry.
      - run: pnpm check:diagrams --base "origin/${{ github.base_ref || github.event.repository.default_branch }}"

  pull-request-body:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Every pull request says which decisions it made that nobody asked for (or "none").
      - env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if ! printf '%s' "$BODY" | grep -qi 'unrequested decisions'; then
            echo "The pull request description needs an 'Unrequested decisions' section. See .github/pull_request_template.md." >&2
            exit 1
          fi

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
